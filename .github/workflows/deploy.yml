name: Build and deploy site

# Every push to main rebuilds the site from the Markdown notes and publishes the
# result to GitHub Pages. Nothing in dist/ is committed — it is produced here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish, but only keep the newest queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # There are no dependencies to install: the builder uses only the Node
      # standard library, so this step is intentionally skipped.

      - name: Build the site
        run: node tools/build.mjs
        env:
          # Pages fills these in; the builder derives the base path from the
          # repository name so project sites (user.github.io/repo/) work too.
          GITHUB_ACTIONS: 'true'

      - name: Verify links and assets
        run: node tools/check.mjs
        env:
          GITHUB_ACTIONS: 'true'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload the built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
