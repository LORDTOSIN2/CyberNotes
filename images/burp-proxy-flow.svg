<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-labelledby="title desc">
  <title id="title">Request path through a local interception proxy</title>
  <desc id="desc">Browser sends traffic to Burp Suite on localhost port 8080, which either forwards it untouched to the target server or holds it for manual editing in Repeater before forwarding.</desc>
  <style>
    .bg { fill: #0e141a; }
    .box { fill: #121a21; stroke: #22303c; }
    .box-p { fill: #121a21; stroke: #34d3b4; }
    .h { fill: #dde6ed; font: 700 13.5px "Inter", Segoe UI, sans-serif; }
    .b { fill: #8697a6; font: 400 12px "Inter", Segoe UI, sans-serif; }
    .m { fill: #7ee0c0; font: 500 11.5px "JetBrains Mono", Consolas, monospace; }
    .label { fill: #8697a6; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .arrow { stroke: #2e4050; stroke-width: 2; fill: none; }
    .ttl { fill: #dde6ed; font: 700 15px "Inter", Segoe UI, sans-serif; }
  </style>
  <rect class="bg" width="920" height="320" rx="12"/>
  <text class="label" x="30" y="30">reference diagram — illustrating the concept</text>
  <text class="ttl" x="30" y="62">Browser → proxy → target</text>

  <defs>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e4050"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="96" width="190" height="96" rx="10"/>
  <text class="h" x="52" y="126">Browser</text>
  <text class="b" x="52" y="150">throwaway profile</text>
  <text class="m" x="52" y="172">http://dvwa.lab/</text>

  <rect class="box-p" x="300" y="80" width="300" height="128" rx="10"/>
  <text class="h" x="322" y="110">Burp Suite — 127.0.0.1:8080</text>
  <text class="b" x="322" y="134">intercept · history · scope</text>
  <text class="b" x="322" y="154">edit the request by hand,</text>
  <text class="b" x="322" y="174">or replay it from Repeater</text>
  <text class="b" x="322" y="196">CA certificate trusted by the browser</text>

  <rect class="box" x="680" y="96" width="210" height="96" rx="10"/>
  <text class="h" x="702" y="126">Target server</text>
  <text class="b" x="702" y="150">answers the request</text>
  <text class="b" x="702" y="172">as the application sees it</text>

  <path class="arrow" d="M220 132 H296" marker-end="url(#a3)"/>
  <path class="arrow" d="M300 168 H224" marker-end="url(#a3)"/>
  <path class="arrow" d="M600 132 H676" marker-end="url(#a3)"/>
  <path class="arrow" d="M680 168 H604" marker-end="url(#a3)"/>

  <text class="m" x="232" y="124">request</text>
  <text class="m" x="232" y="188">response</text>
  <text class="m" x="612" y="124">forwarded</text>
  <text class="m" x="612" y="188">returned</text>

  <text class="b" x="30" y="268">Everything you test in Repeater is a request you can paste into a note verbatim — that is what makes a finding reproducible.</text>
  <text class="b" x="30" y="292">Remove the interception CA from the browser profile when the engagement ends.</text>
</svg>
