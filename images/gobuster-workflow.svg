<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
  <title id="title">Web content discovery workflow</title>
  <desc id="desc">A five stage workflow: live host, baseline scan, noise filtering, recursive pass on real hits, then triage of the shortlist into a report table.</desc>
  <style>
    .bg { fill: #0e141a; }
    .box { fill: #121a21; stroke: #22303c; }
    .box-accent { fill: #121a21; stroke: #34d3b4; }
    .h { fill: #dde6ed; font: 700 13.5px "Inter", Segoe UI, sans-serif; }
    .b { fill: #8697a6; font: 400 12px "Inter", Segoe UI, sans-serif; }
    .cmd { fill: #7ee0c0; font: 500 11.5px "JetBrains Mono", Consolas, monospace; }
    .arrow { stroke: #2e4050; stroke-width: 2; fill: none; }
    .label { fill: #8697a6; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .num { fill: #0a0e12; font: 700 12px "JetBrains Mono", Consolas, monospace; }
    .badge { fill: #34d3b4; }
    .note { fill: #f0b429; font: 500 12px "Inter", Segoe UI, sans-serif; }
  </style>
  <rect class="bg" width="920" height="400" rx="12"/>
  <text class="label" x="30" y="30">reference diagram — illustrating the workflow</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e4050"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect class="box" x="30" y="56" width="200" height="112" rx="10"/>
  <circle class="badge" cx="52" cy="78" r="11"/><text class="num" x="48" y="83">1</text>
  <text class="h" x="72" y="83">Establish a baseline</text>
  <text class="b" x="46" y="106">Record the catch-all</text>
  <text class="b" x="46" y="124">response: status code</text>
  <text class="b" x="46" y="142">and body length.</text>

  <!-- 2 -->
  <rect class="box-accent" x="266" y="56" width="200" height="112" rx="10"/>
  <circle class="badge" cx="288" cy="78" r="11"/><text class="num" x="284" y="83">2</text>
  <text class="h" x="308" y="83">Baseline scan</text>
  <text class="cmd" x="282" y="108">gobuster dir -u URL</text>
  <text class="cmd" x="282" y="124">-w raft-medium-…</text>
  <text class="cmd" x="282" y="140">-x php,txt,bak -t 40</text>

  <!-- 3 -->
  <rect class="box" x="502" y="56" width="200" height="112" rx="10"/>
  <circle class="badge" cx="524" cy="78" r="11"/><text class="num" x="520" y="83">3</text>
  <text class="h" x="544" y="83">Filter the noise</text>
  <text class="b" x="518" y="106">--exclude-length for</text>
  <text class="b" x="518" y="124">the shared 404 size,</text>
  <text class="b" x="518" y="142">then re-run once.</text>

  <!-- 4 -->
  <rect class="box" x="738" y="56" width="152" height="112" rx="10"/>
  <circle class="badge" cx="760" cy="78" r="11"/><text class="num" x="756" y="83">4</text>
  <text class="h" x="780" y="83">Recurse</text>
  <text class="b" x="754" y="106">Only into paths</text>
  <text class="b" x="754" y="124">that returned</text>
  <text class="b" x="754" y="142">something real.</text>

  <!-- arrows row 1 -->
  <path class="arrow" d="M230 112 H262" marker-end="url(#a)"/>
  <path class="arrow" d="M466 112 H498" marker-end="url(#a)"/>
  <path class="arrow" d="M702 112 H734" marker-end="url(#a)"/>
  <path class="arrow" d="M814 168 V196" marker-end="url(#a)"/>

  <!-- triage -->
  <rect class="box" x="238" y="200" width="452" height="150" rx="10"/>
  <circle class="badge" cx="260" cy="222" r="11"/><text class="num" x="256" y="227">5</text>
  <text class="h" x="280" y="227">Triage the shortlist, then decide</text>

  <rect x="262" y="244" width="120" height="88" rx="6" fill="#17212a" stroke="#22303c"/>
  <text class="cmd" x="274" y="266" fill="#f0b429">200 / 302</text>
  <text class="b" x="274" y="288">open it in the</text>
  <text class="b" x="274" y="304">browser, then</text>
  <text class="b" x="274" y="320">in burp</text>

  <rect x="394" y="244" width="120" height="88" rx="6" fill="#17212a" stroke="#22303c"/>
  <text class="cmd" x="406" y="266" fill="#ff9d7a">401 / 403</text>
  <text class="b" x="406" y="288">exists, weak</text>
  <text class="b" x="406" y="304">authorization —</text>
  <text class="b" x="406" y="320">test bypasses</text>

  <rect x="526" y="244" width="146" height="88" rx="6" fill="#17212a" stroke="#22303c"/>
  <text class="cmd" x="538" y="266" fill="#ff7a70">500</text>
  <text class="b" x="538" y="288">valid route with a</text>
  <text class="b" x="538" y="304">server error — the</text>
  <text class="b" x="538" y="320">most interesting hit</text>

  <text class="note" x="30" y="382">Keep the raw -o output for every run: it is the evidence behind the shortlist.</text>
</svg>
