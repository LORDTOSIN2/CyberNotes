<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="title desc">
  <title id="title">SQL injection pathway from detection to extraction, and the parameterised fix</title>
  <desc id="desc">Four stages across the top: detection by breaking syntax, boolean confirmation, UNION extraction, and remediation through parameterised queries.</desc>
  <style>
    .bg { fill: #0e141a; }
    .box { fill: #121a21; stroke: #22303c; }
    .h { fill: #dde6ed; font: 700 13.5px "Inter", Segoe UI, sans-serif; }
    .b { fill: #8697a6; font: 400 12px "Inter", Segoe UI, sans-serif; }
    .p { fill: #ffd479; font: 500 12px "JetBrains Mono", Consolas, monospace; }
    .label { fill: #8697a6; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .arrow { stroke: #2e4050; stroke-width: 2; fill: none; }
    .badge { fill: #82d2ff; }
    .num { fill: #0a0e12; font: 700 11px "JetBrains Mono", Consolas, monospace; }
    .ok { fill: #5ad1a0; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .fix { fill: #0e141a; stroke: #5ad1a0; }
  </style>
  <rect class="bg" width="920" height="460" rx="12"/>
  <text class="label" x="30" y="30">reference diagram — illustrating the method</text>

  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e4050"/>
    </marker>
  </defs>

  <rect class="box" x="30" y="52" width="200" height="150" rx="10"/>
  <circle class="badge" cx="52" cy="74" r="11"/><text class="num" x="48" y="79">1</text>
  <text class="h" x="72" y="79">Break the syntax</text>
  <text class="p" x="46" y="106">'</text>
  <text class="b" x="46" y="130">A driver error proves</text>
  <text class="b" x="46" y="148">the quote reached the</text>
  <text class="b" x="46" y="166">parser.</text>
  <text class="p" x="46" y="190">'' → normal page</text>

  <rect class="box" x="256" y="52" width="200" height="150" rx="10"/>
  <circle class="badge" cx="278" cy="74" r="11"/><text class="num" x="274" y="79">2</text>
  <text class="h" x="298" y="79">Confirm with logic</text>
  <text class="p" x="272" y="106">1' AND '1'='1</text>
  <text class="b" x="272" y="130">True returns content,</text>
  <text class="b" x="272" y="148">false returns nothing.</text>
  <text class="b" x="272" y="166">Works even when</text>
  <text class="b" x="272" y="184">errors are suppressed.</text>

  <rect class="box" x="482" y="52" width="200" height="150" rx="10"/>
  <circle class="badge" cx="504" cy="74" r="11"/><text class="num" x="500" y="79">3</text>
  <text class="h" x="524" y="79">Extract</text>
  <text class="p" x="498" y="106">ORDER BY n → columns</text>
  <text class="p" x="498" y="128">UNION SELECT 1,2</text>
  <text class="p" x="498" y="150">database(), table_name</text>
  <text class="b" x="498" y="174">Then the columns you</text>
  <text class="b" x="498" y="192">actually came for.</text>

  <rect class="box" x="708" y="52" width="182" height="150" rx="10"/>
  <circle class="badge" cx="730" cy="74" r="11"/><text class="num" x="726" y="79">4</text>
  <text class="h" x="750" y="79">Report</text>
  <text class="b" x="724" y="106">Endpoint, parameter,</text>
  <text class="b" x="724" y="124">payload that worked,</text>
  <text class="b" x="724" y="142">impact, and the fix.</text>
  <text class="b" x="724" y="168">Reproducibility beats</text>
  <text class="b" x="724" y="186">impressive payloads.</text>

  <path class="arrow" d="M230 127 H252" marker-end="url(#a2)"/>
  <path class="arrow" d="M456 127 H478" marker-end="url(#a2)"/>
  <path class="arrow" d="M682 127 H704" marker-end="url(#a2)"/>
  <path class="arrow" d="M542 202 V244" marker-end="url(#a2)"/>

  <rect class="fix" x="200" y="250" width="520" height="150" rx="10"/>
  <text class="ok" x="224" y="278">The fix that actually removes the class</text>
  <text class="p" x="224" y="308" fill="#7ee0c0">$stmt = $conn-&gt;prepare(</text>
  <text class="p" x="240" y="328" fill="#7ee0c0">'SELECT ... WHERE user_id = ?');</text>
  <text class="p" x="224" y="354" fill="#7ee0c0">$stmt-&gt;bind_param('i', $_GET['id']);</text>
  <text class="p" x="224" y="374" fill="#7ee0c0">$stmt-&gt;execute();</text>

  <text class="b" x="30" y="440">Layers around it: least-privilege database account · WAF rules · generic error pages · alerting on SQLSTATE bursts</text>
</svg>
