<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">SUID execution flow: dropping privileges versus keeping them</title>
  <desc id="desc">Comparison of a correctly written SUID binary that drops privileges before executing user input, against a vulnerable one that executes user input while still running as root.</desc>
  <style>
    .bg { fill: #0e141a; }
    .panel { fill: #121a21; stroke: #22303c; }
    .panel-bad { fill: #121a21; stroke: #ff7a70; }
    .panel-good { fill: #121a21; stroke: #5ad1a0; }
    .h { fill: #dde6ed; font: 700 14px "Inter", Segoe UI, sans-serif; }
    .b { fill: #b9c6d1; font: 400 12.5px "Inter", Segoe UI, sans-serif; }
    .cmd { fill: #7ee0c0; font: 500 12px "JetBrains Mono", Consolas, monospace; }
    .label { fill: #8697a6; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .arrow { stroke: #2e4050; stroke-width: 2; fill: none; }
    .good { fill: #5ad1a0; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .bad { fill: #ff7a70; font: 600 12px "JetBrains Mono", Consolas, monospace; }
    .step { fill: #0a0e12; font: 700 11px "JetBrains Mono", Consolas, monospace; }
    .num-good { fill: #5ad1a0; }
    .num-bad { fill: #ff7a70; }
  </style>
  <rect class="bg" width="920" height="420" rx="12"/>
  <text class="label" x="30" y="30">reference diagram — illustrating the concept</text>

  <defs>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#2e4050"/>
    </marker>
  </defs>

  <!-- shared entry -->
  <rect class="panel" x="30" y="52" width="860" height="66" rx="10"/>
  <text class="h" x="52" y="80">Unprivileged user runs a SUID-root binary</text>
  <text class="b" x="52" y="102">uid=1000(dev) euid=0(root) — the kernel grants the effective UID from the file mode bits, not from the caller</text>

  <path class="arrow" d="M300 118 V150" marker-end="url(#ag)"/>
  <path class="arrow" d="M660 118 V150" marker-end="url(#ag)"/>

  <!-- safe path -->
  <rect class="panel-good" x="30" y="156" width="420" height="228" rx="10"/>
  <circle class="num-good" cx="0" cy="0" r="0"/>
  <ellipse cx="54" cy="182" rx="12" ry="12" fill="#5ad1a0"/><text class="step" x="50" y="187">✓</text>
  <text class="h" x="76" y="187">Safely written</text>

  <text class="cmd" x="52" y="216">setuid(0); /* deliberate, temporary */</text>
  <text class="b" x="52" y="242">1. validate that the caller is allowed</text>
  <text class="b" x="52" y="262">2. do the one privileged operation</text>
  <text class="b" x="52" y="282">3. setresuid(getuid(), getuid(), getuid())</text>
  <text class="b" x="52" y="302">4. exec the caller's command as the caller</text>

  <text class="good" x="52" y="334">result: euid=1000(dev) — no privilege left</text>
  <text class="b" x="52" y="358">An injection into the command argument stays</text>
  <text class="b" x="52" y="374">an unprivileged shell.</text>

  <!-- vulnerable path -->
  <rect class="panel-bad" x="470" y="156" width="420" height="228" rx="10"/>
  <ellipse cx="494" cy="182" rx="12" ry="12" fill="#ff7a70"/><text class="step" x="490" y="187">✕</text>
  <text class="h" x="516" y="187">Vulnerable</text>

  <text class="cmd" x="492" y="216">system(user_input); /* still euid=0 */</text>
  <text class="b" x="492" y="242">1. no caller validation</text>
  <text class="b" x="492" y="262">2. caller-supplied string reaches a shell</text>
  <text class="b" x="492" y="282">3. privileges are never dropped</text>
  <text class="b" x="492" y="302">4. the shell inherits euid=0(root)</text>

  <text class="bad" x="492" y="334">result: euid=0(root) — full compromise</text>
  <text class="b" x="492" y="358">Any argument the caller controls is now an</text>
  <text class="b" x="492" y="374">arbitrary-root-command primitive.</text>

  <text class="label" x="30" y="408">Detection: find / -perm -4000 · baseline the set · alert on new files in /tmp, /home and /opt</text>
</svg>
