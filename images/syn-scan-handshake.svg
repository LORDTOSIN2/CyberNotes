<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">TCP three-way handshake compared with an Nmap SYN scan</title>
  <desc id="desc">Left: a full TCP connect handshake completing with SYN, SYN-ACK, ACK. Right: an Nmap SYN scan stopping after SYN-ACK by sending RST.</desc>
  <style>
    .bg { fill: #0e141a; }
    .panel { fill: #121a21; stroke: #22303c; }
    .lane { stroke: #2e4050; stroke-width: 1.5; }
    .label { fill: #8697a6; font: 600 13px "JetBrains Mono", Consolas, monospace; }
    .who { fill: #dde6ed; font: 700 14px "JetBrains Mono", Consolas, monospace; }
    .step { fill: #b9c6d1; font: 500 13px "Inter", Segoe UI, sans-serif; }
    .pkt { stroke-width: 2; fill: none; }
    .c2s { stroke: #7ee0c0; }
    .s2c { stroke: #82d2ff; }
    .rst { stroke: #ff7a70; stroke-dasharray: 6 4; }
    .tag { font: 600 11px "JetBrains Mono", Consolas, monospace; }
    .t-c2s { fill: #7ee0c0; }
    .t-s2c { fill: #82d2ff; }
    .t-rst { fill: #ff7a70; }
    .title { fill: #dde6ed; font: 700 15px "Inter", Segoe UI, sans-serif; }
    .note { fill: #f0b429; font: 500 12px "Inter", Segoe UI, sans-serif; }
  </style>
  <rect class="bg" width="920" height="420" rx="12"/>
  <text class="label" x="30" y="30">reference diagram — illustrating the concept</text>

  <!-- full handshake -->
  <rect class="panel" x="30" y="48" width="400" height="330" rx="10"/>
  <text class="title" x="52" y="76">Full handshake (–sT connect)</text>
  <text class="who" x="52" y="112">client</text>
  <text class="who" x="350" y="112">target</text>
  <line class="lane" x1="96" y1="124" x2="96" y2="330"/>
  <line class="lane" x1="382" y1="124" x2="382" y2="330"/>

  <line class="pkt c2s" x1="96" y1="150" x2="382" y2="168" marker-end="url(#arrowA)"/>
  <text class="tag t-c2s" x="104" y="146">SYN</text>
  <line class="pkt s2c" x1="382" y1="196" x2="96" y2="214" marker-end="url(#arrowB)"/>
  <text class="tag t-s2c" x="300" y="192">SYN, ACK</text>
  <line class="pkt c2s" x1="96" y1="242" x2="382" y2="260" marker-end="url(#arrowA)"/>
  <text class="tag t-c2s" x="104" y="238">ACK</text>
  <text class="step" x="52" y="300">A session is established.</text>
  <text class="step" x="52" y="320">The application logs a connection.</text>
  <text class="step" x="52" y="340">The scanner waits for a response.</text>

  <!-- syn scan -->
  <rect class="panel" x="470" y="48" width="420" height="330" rx="10"/>
  <text class="title" x="492" y="76">SYN scan (–sS half-open)</text>
  <text class="who" x="492" y="112">client</text>
  <text class="who" x="790" y="112">target</text>
  <line class="lane" x1="536" y1="124" x2="536" y2="330"/>
  <line class="lane" x1="822" y1="124" x2="822" y2="330"/>

  <line class="pkt c2s" x1="536" y1="150" x2="822" y2="168" marker-end="url(#arrowA)"/>
  <text class="tag t-c2s" x="544" y="146">SYN</text>
  <line class="pkt s2c" x1="822" y1="196" x2="536" y2="214" marker-end="url(#arrowB)"/>
  <text class="tag t-s2c" x="740" y="192">SYN, ACK → open</text>
  <line class="pkt rst" x1="536" y1="242" x2="822" y2="260" marker-end="url(#arrowC)"/>
  <text class="tag t-rst" x="544" y="238">RST — conversation dropped</text>
  <text class="step" x="492" y="300">No session, so no application log entry.</text>
  <text class="step" x="492" y="320">RST instead of ACK ⇒ the port is closed.</text>
  <text class="step" x="492" y="340">Silence ⇒ the port is filtered.</text>

  <text class="note" x="30" y="402">Replace this with a screenshot of your own scan output once you have one.</text>

  <defs>
    <marker id="arrowA" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7ee0c0"/>
    </marker>
    <marker id="arrowB" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#82d2ff"/>
    </marker>
    <marker id="arrowC" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff7a70"/>
    </marker>
  </defs>
</svg>
